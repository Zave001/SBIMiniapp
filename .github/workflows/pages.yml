# Сборка и публикация Mini App на GitHub Pages.
#
#   ветка main → https://zave001.github.io/SBIMiniapp/
#
# Одна сборка обслуживает и тестового, и продакшн-бота: каждый бот передаёт
# адрес своего сервера в ссылке (?api=https://…). Приложение принимает только
# адреса из VITE_API_SERVERS — их задают переменные репозитория
# (Settings → Secrets and variables → Actions → Variables):
#   PROD_API_BASE — сервер продакшн-бота (он же адрес по умолчанию, если ?api= нет);
#   TEST_API_BASE — сервер тестового бота (по умолчанию https://is-torus.online).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Сборка
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.PROD_API_BASE }}
          VITE_API_SERVERS: ${{ vars.PROD_API_BASE }},${{ vars.TEST_API_BASE || 'https://is-torus.online' }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
